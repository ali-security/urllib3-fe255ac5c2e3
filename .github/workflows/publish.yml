name: Publish to PyPI

# Seal: dispatched on the fork instead of on push/tag; the build job is unchanged.
on: workflow_dispatch

permissions:
  contents: "read"

jobs:
  build:
    name: "Build distribution 📦"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.x"

      - name: "Install dependencies"
        run: python -m pip install build==0.8.0

      - name: "Build dists"
        env:
          # Time machine: the isolated build env resolves the backend as of the
          # 2.3.0 release date, which is what produced the released wheel's
          # `Generator: hatchling 1.27.0`. No version is forced outside what
          # pyproject already declares (hatchling>=1.6.0,<2).
          PIP_INDEX_URL: "https://:2024-12-22T07:47:28.074156Z@time-machines-pypi.sealsecurity.io/"
          # hatch-vcs calls setuptools_scm without a dist name, so the
          # _FOR_URLLIB3 variant is never consulted — the unqualified var is the
          # one that takes. Needed because the fork carries patch commits on top
          # of the 2.3.0 tag, which would otherwise yield 2.3.1.devN.
          SETUPTOOLS_SCM_PRETEND_VERSION: "2.3.0"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_URLLIB3: "2.3.0"
        run: |
          SOURCE_DATE_EPOCH=1734852862 \
          python -m build

      - name: "Generate hashes"
        id: hash
        run: |
          cd dist && echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

      - name: "Upload dists"
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: "dist"
          path: "dist/"
          if-no-files-found: error
          retention-days: 5
